name: linter
 
on:
  push:
  pull_request:
 
jobs:
  yamllint:
    name: Lint action.yml files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Install yamllint
        run: pip install yamllint
 
      - name: Lint all action.yml files
        run: yamllint **/action.yml
